<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coronary Angiography</title>
<style>
:root{--bg:#0d0f12;--card:#16191e;--line:#262b33;--text:#e7e9ec;--muted:#8b929c;--accent:#4aa3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{padding:28px 16px 8px;max-width:1200px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;font-weight:600}
.sub{color:var(--muted);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);text-decoration:none;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card video{display:block;width:100%;aspect-ratio:1/1;background:#000}
.meta{padding:10px 12px 12px}
.meta b{font-size:15px}
.meta .v{color:var(--muted);font-size:13px}
.acts{display:flex;gap:8px;margin-top:8px}
.acts .btn{padding:6px 10px;font-size:13px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:0 16px 30px}
</style>
</head>
<body>
<header>
  <h1>Coronary Angiography</h1>
  <div class="sub" id="sub">Loading…</div>
  <div class="bar">
    <a class="btn primary" href="viewer.html">Open DICOM viewer</a>
  </div>
</header>
<main id="grid"></main>
<footer>Videos are previews made from the original DICOM files. Use the DICOM viewer or download the .dcm files for diagnostic review.</footer>
<script>
function fmtDate(s){if(!s||s.length!==8)return s;const m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return `${+s.slice(6)} ${m[+s.slice(4,6)-1]} ${s.slice(0,4)}`}
function mb(n){return (n/1048576).toFixed(1)+" MB"}
fetch("manifest.json").then(r=>r.json()).then(m=>{
  document.getElementById("sub").textContent=`Study date ${fmtDate(m.date)} · ${m.runs.length} runs · ${m.runs[0].fps} fps cine`;
  const g=document.getElementById("grid");
  m.runs.forEach((r,i)=>{
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`<video src="video/${r.id}.mp4" poster="poster/${r.id}.jpg" controls loop muted playsinline preload="metadata"></video>
    <div class="meta"><b>Run ${i+1}</b> <span class="v">· ${r.view} · ${r.frames} frames · ${r.time}</span>
    <div class="acts"><a class="btn" href="viewer.html?run=${i+1}">Open in viewer</a><a class="btn" href="dicom/${r.id}.dcm" download>Download .dcm (${mb(r.size)})</a></div></div>`;
    g.appendChild(c);
  });
});
</script>
</body>
</html>
